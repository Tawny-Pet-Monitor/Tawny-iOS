name: iOS

# Everything iOS happens here, on GitHub's macOS runners: no Mac needed.
#   test   unit tests on the simulator, then screenshots of every screen in
#          light and dark (artifact "screenshots")
#   ipa    a device build: an unsigned IPA for sideloading (artifact
#          "Tawny-unsigned-ipa"), and, when run by hand with "testflight"
#          ticked, a signed build uploaded to TestFlight.
# The repo is public, so these macOS minutes are free.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight (needs the App Store Connect secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  test:
    name: Test and screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Generate the Xcode project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          XCODEGEN=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          "$XCODEGEN" --version
          "$XCODEGEN" generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for rt in sorted((r for r in devices if "iOS" in r), key=ver, reverse=True):
              phones = [d for d in devices[rt] if d["name"].startswith("iPhone")]
              plain = [d for d in phones if re.fullmatch(r"iPhone \d+", d["name"])]
              pick = (plain or phones or [None])[-1]
              if pick:
                  print(pick["udid"]); sys.stderr.write(pick["name"] + " on " + rt + "\n"); break
          ')
          test -n "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -quiet \
            -project Tawny.xcodeproj -scheme Tawny \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult \
            | tee -a build/test.log

      - name: Screenshots
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/Tawny.app
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi \
            --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for screen in welcome role setup scan name home confirm settings support lightning help diagnostics pairsheet; do
              xcrun simctl launch --terminate-running-process "$UDID" com.tawny.monitor -TawnyDemo "$screen" >/dev/null
              sleep 4
              xcrun simctl io "$UDID" screenshot "screenshots/$mode-$screen.png" >/dev/null 2>&1
            done
          done
          ls screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/test.log
          if-no-files-found: ignore
          retention-days: 14

  ipa:
    name: Device build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          XCODEGEN=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          "$XCODEGEN" generate

      - name: Archive, unsigned
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive -quiet \
            -project Tawny.xcodeproj -scheme Tawny -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Tawny.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/archive.log
          mkdir -p build/ipa/Payload
          cp -R build/Tawny.xcarchive/Products/Applications/Tawny.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Tawny-unsigned.ipa Payload)
          ls -la build/Tawny-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tawny-unsigned-ipa
          path: build/Tawny-unsigned.ipa
          retention-days: 30

      # App Store Connect API key signing: Xcode makes or reuses the
      # distribution certificate and profile itself (cloud-managed), so there
      # is no .p12 or provisioning profile to keep. The key needs the Admin
      # role.
      - name: Sign and upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild archive -quiet \
            -project Tawny.xcodeproj -scheme Tawny -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Tawny-signed.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Tawny-signed.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            "${AUTH[@]}"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect. It shows in TestFlight after processing."
